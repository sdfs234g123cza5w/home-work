<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Позиционирование элементов</title>
</head>
<style>
   div{
      position: static;
      color:aliceblue;
      background-color: black;
   }
   .fourth{
      position: relative;
      top: 10px;
      right: 18px;
      bottom: 20px;
      left: 5px;
      background-color:blue
   }
   .five{
      position: relative;
      width: 300px;
      height: 400px;
   }
   .six{
      position: absolute;
      top:5%;
      left:5%;
      background-color: red;
   }
   .seven{
      position: fixed;
      bottom: 10px;
      right: 10px;
      color:green;
      background-color:gold;
   }
   .eight{
      position: sticky;
      color:chocolate;
      top: 10px;
   }
</style>
<body>
   <!--sticky фиксирует текст там где до этого он был и при прокруте страницы он будет тоже двигаться-->
   <h1 class="eight">Позиционирование элементов - sticky</h1>
   <h1>Заголовок 2</h1>
   <h1>Вацап это месенджер</h1>
   <!--БЛОЧНЫЕ идут столбиком, а СТРОЧНЫЕ идут в одну строку-->
   <div class="first">Коты всегда приземляються на лапы</div>
   <div class="second">Вода - напиток жизни</div>
   <div class="third">Акула</div>
   <!--Смещает элемент относительно его нормального положения не мешая другим элементам-->
   <h1 class="fourth">Мандарин</h1>
   <div class="five">
      <h2>Фисташки</h2>
      <p class="six">Новый год</p>
      <!--закрепляет элемент на одном месте относительно окна просмотра браузера, независимо от прокрутки страницы-->
   <p class="seven">Пингвины</p>
</div>
</body>
